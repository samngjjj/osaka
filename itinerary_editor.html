<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>大阪關西 9 天 8 夜 ‧ 智慧拖曳行程編輯器 ＆ 文字匯出器</title>
  
  <!-- Mobile & PWA Meta -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="行程編輯器">
  <meta name="theme-color" content="#070a12">
  <meta name="description" content="大阪關西 9 天 8 夜互動拖曳行程編輯器：按時間順序隨心拖曳排序、即時編輯調整、一鍵智慧時間排序、多種格式即時輸出純文字版行程表（LINE/WhatsApp/Notion）。">

  <!-- Google Fonts: Plus Jakarta Sans & Noto Sans TC & Zen Old Mincho -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;900&family=Plus+Jakarta+Sans:wght@500;600;700;800;900&family=Zen+Old+Mincho:wght@700;900&display=swap" rel="stylesheet">
  
  <!-- Font Awesome 6.5 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- SortableJS for buttery smooth touch & mouse drag and drop -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>

  <style>
    /* ==========================================================================
       Osaka Neon Editor Design Tokens
       ========================================================================== */
    :root {
      --bg-dark: #070a12;
      --bg-surface: #0e1424;
      --bg-surface-elevated: #151f38;
      --bg-card: rgba(18, 26, 46, 0.9);
      --bg-card-hover: rgba(26, 38, 68, 0.95);
      --bg-glass: rgba(14, 20, 36, 0.85);

      /* Osaka Neon Palette */
      --neon-pink: #ff2a6d;
      --neon-cyan: #05d9e8;
      --neon-gold: #ffb800;
      --neon-green: #00e676;
      --neon-purple: #a855f7;
      --neon-blue: #3a86ff;
      --neon-coral: #ff5e7e;
      
      --text-white: #ffffff;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-glow-cyan: rgba(5, 217, 232, 0.35);
      --border-glow-pink: rgba(255, 42, 109, 0.35);
      --border-glow-gold: rgba(255, 184, 0, 0.35);

      --ease-spring: cubic-bezier(0.16, 1, 0.3, 1);
      
      --radius-full: 9999px;
      --radius-xl: 20px;
      --radius-lg: 14px;
      --radius-md: 10px;
      --radius-sm: 6px;
      
      --safe-bottom: env(safe-area-inset-bottom, 20px);
      --safe-top: env(safe-area-inset-top, 20px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      overscroll-behavior-x: none;
      touch-action: pan-y;
      -webkit-overflow-scrolling: touch;
    }

    body {
      font-family: 'Plus Jakarta Sans', 'Noto Sans TC', -apple-system, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      line-height: 1.5;
      min-height: 100vh;
      padding-top: calc(var(--safe-top) + 64px);
      padding-bottom: calc(var(--safe-bottom) + 90px);
      overflow-x: hidden;
      position: relative;
    }

    /* Ambient Background Layer */
    .bg-mesh {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 0;
      background: 
        radial-gradient(circle at 10% 10%, rgba(255, 42, 109, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 90% 20%, rgba(5, 217, 232, 0.12) 0%, transparent 45%),
        radial-gradient(circle at 50% 85%, rgba(168, 85, 247, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 80% 90%, rgba(255, 184, 0, 0.08) 0%, transparent 40%);
      background-attachment: fixed;
    }

    .app-container {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 16px;
      position: relative;
      z-index: 1;
    }

    /* Top Sticky Header */
    .top-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 300;
      background: rgba(7, 10, 18, 0.94);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border-subtle);
      padding-top: var(--safe-top);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
    }

    .header-content {
      max-width: 900px;
      margin: 0 auto;
      height: 60px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-badge {
      font-family: 'Zen Old Mincho', serif;
      background: linear-gradient(135deg, var(--neon-pink), #ff758c);
      color: #fff;
      font-weight: 900;
      font-size: 0.85rem;
      padding: 4px 10px;
      border-radius: var(--radius-sm);
      box-shadow: 0 2px 10px rgba(255, 42, 109, 0.4);
    }

    .brand-title {
      font-size: 1.05rem;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.3px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .brand-title span.sub {
      color: var(--neon-cyan);
      font-size: 0.82rem;
      font-weight: 600;
      background: rgba(5, 217, 232, 0.12);
      padding: 2px 8px;
      border-radius: var(--radius-full);
      border: 1px solid rgba(5, 217, 232, 0.3);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-header {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      padding: 7px 12px;
      border-radius: var(--radius-full);
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s var(--ease-spring);
      text-decoration: none;
    }

    .btn-header:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      transform: translateY(-1px);
    }

    .btn-header.primary {
      background: linear-gradient(135deg, var(--neon-pink), #e01e5a);
      color: #fff;
      border: none;
      box-shadow: 0 4px 15px rgba(255, 42, 109, 0.35);
    }

    .btn-header.primary:hover {
      box-shadow: 0 6px 20px rgba(255, 42, 109, 0.5);
    }

    /* Day Selector Tabs Bar */
    .day-selector-bar {
      position: sticky;
      top: calc(var(--safe-top) + 60px);
      z-index: 250;
      background: rgba(7, 10, 18, 0.92);
      backdrop-filter: blur(15px);
      border-bottom: 1px solid var(--border-subtle);
      padding: 10px 16px;
      margin: 0 -16px 20px -16px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .day-selector-bar::-webkit-scrollbar {
      display: none;
    }

    .day-pill-btn {
      flex-shrink: 0;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      padding: 8px 16px;
      border-radius: var(--radius-full);
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.25s var(--ease-spring);
      white-space: nowrap;
    }

    .day-pill-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }

    .day-pill-btn.active {
      background: linear-gradient(135deg, var(--neon-cyan), #00b4d8);
      color: #070a12;
      border-color: transparent;
      box-shadow: 0 4px 15px rgba(5, 217, 232, 0.4);
      font-weight: 800;
    }

    /* Hero Tips Card */
    .editor-tips-card {
      background: linear-gradient(135deg, rgba(5, 217, 232, 0.1) 0%, rgba(14, 20, 36, 0.8) 100%);
      border: 1px solid rgba(5, 217, 232, 0.25);
      border-radius: var(--radius-xl);
      padding: 16px 20px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
    }

    .tips-left {
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    .tips-icon {
      font-size: 1.5rem;
      color: var(--neon-cyan);
      background: rgba(5, 217, 232, 0.15);
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .tips-content h4 {
      font-size: 0.98rem;
      font-weight: 800;
      color: #fff;
      margin-bottom: 4px;
    }

    .tips-content p {
      font-size: 0.82rem;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .tips-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      flex-shrink: 0;
    }

    .btn-action-tool {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-subtle);
      color: #fff;
      padding: 8px 14px;
      border-radius: var(--radius-full);
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s var(--ease-spring);
    }

    .btn-action-tool:hover {
      background: rgba(255, 255, 255, 0.16);
      transform: translateY(-2px);
    }

    .btn-action-tool.sort-btn {
      background: linear-gradient(135deg, rgba(0, 230, 118, 0.2), rgba(0, 230, 118, 0.08));
      border-color: rgba(0, 230, 118, 0.4);
      color: var(--neon-green);
    }

    .btn-action-tool.sort-btn:hover {
      background: var(--neon-green);
      color: #070a12;
    }

    .btn-action-tool.add-btn {
      background: linear-gradient(135deg, rgba(255, 42, 109, 0.2), rgba(255, 42, 109, 0.08));
      border-color: rgba(255, 42, 109, 0.4);
      color: var(--neon-coral);
    }

    .btn-action-tool.add-btn:hover {
      background: var(--neon-pink);
      color: #fff;
    }

    /* Day Container & Day Headers */
    .day-block {
      margin-bottom: 28px;
      animation: fadeIn 0.3s var(--ease-spring);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .day-block-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(90deg, rgba(14, 20, 36, 0.95) 0%, rgba(21, 31, 56, 0.8) 100%);
      border: 1px solid var(--border-subtle);
      border-left: 4px solid var(--neon-pink);
      border-radius: var(--radius-lg);
      padding: 12px 16px;
      margin-bottom: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    .day-block-title {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .day-num-tag {
      background: var(--neon-pink);
      color: #fff;
      font-size: 0.75rem;
      font-weight: 900;
      padding: 2px 8px;
      border-radius: var(--radius-sm);
      letter-spacing: 0.5px;
    }

    .day-main-heading {
      font-size: 1.05rem;
      font-weight: 800;
      color: #fff;
    }

    .day-date-tag {
      font-size: 0.8rem;
      color: var(--neon-cyan);
      font-weight: 600;
    }

    .day-item-count {
      font-size: 0.75rem;
      color: var(--text-dim);
      background: rgba(255, 255, 255, 0.05);
      padding: 3px 8px;
      border-radius: var(--radius-full);
    }

    /* Sortable List & Cards */
    .timeline-sortable-list {
      min-height: 50px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Item Card Styles */
    .itinerary-card {
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 14px 16px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      position: relative;
      transition: transform 0.2s var(--ease-spring), box-shadow 0.2s, border-color 0.2s;
      cursor: grab;
      user-select: none;
    }

    .itinerary-card:hover {
      border-color: rgba(255, 255, 255, 0.18);
      background: var(--bg-card-hover);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
    }

    .itinerary-card.sortable-ghost {
      opacity: 0.35;
      background: rgba(5, 217, 232, 0.15);
      border: 2px dashed var(--neon-cyan);
      box-shadow: 0 0 25px rgba(5, 217, 232, 0.3);
    }

    .itinerary-card.sortable-chosen {
      background: rgba(26, 38, 68, 0.98);
      border-color: var(--neon-cyan);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6), 0 0 15px rgba(5, 217, 232, 0.3);
      cursor: grabbing;
    }

    .itinerary-card.sortable-drag {
      opacity: 0.95;
      transform: scale(1.02) rotate(1deg);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), 0 0 20px rgba(255, 42, 109, 0.4);
      cursor: grabbing;
    }

    /* Card Types */
    .itinerary-card.type-transit {
      background: rgba(14, 20, 36, 0.7);
      border-style: dashed;
      border-color: rgba(5, 217, 232, 0.25);
    }

    .itinerary-card.type-transit:hover {
      border-color: rgba(5, 217, 232, 0.5);
    }

    .itinerary-card.type-highlight {
      border-left: 3px solid var(--neon-pink);
    }

    .itinerary-card.type-food {
      border-left: 3px solid var(--neon-gold);
    }

    .itinerary-card.type-sleep {
      border-left: 3px solid var(--neon-purple);
      background: linear-gradient(135deg, rgba(168, 85, 247, 0.12) 0%, rgba(14, 20, 36, 0.85) 100%);
    }

    /* Drag Handle */
    .drag-handle {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 6px 4px;
      color: var(--text-dim);
      cursor: grab;
      flex-shrink: 0;
      transition: color 0.2s;
    }

    .itinerary-card:hover .drag-handle {
      color: var(--neon-cyan);
    }

    .drag-handle i {
      font-size: 1.1rem;
    }

    /* Card Main Body */
    .card-body {
      flex: 1;
      min-width: 0;
    }

    .card-top-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
    }

    .time-slot-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 0.82rem;
      font-weight: 800;
      color: var(--neon-pink);
      background: rgba(255, 42, 109, 0.12);
      padding: 3px 10px;
      border-radius: var(--radius-full);
      border: 1px solid rgba(255, 42, 109, 0.3);
    }

    .time-slot-badge.transit {
      color: var(--neon-cyan);
      background: rgba(5, 217, 232, 0.12);
      border-color: rgba(5, 217, 232, 0.3);
    }

    .time-slot-badge.food {
      color: var(--neon-gold);
      background: rgba(255, 184, 0, 0.12);
      border-color: rgba(255, 184, 0, 0.3);
    }

    .time-slot-badge.free {
      color: var(--neon-green);
      background: rgba(0, 230, 118, 0.12);
      border-color: rgba(0, 230, 118, 0.3);
    }

    .card-tags {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .category-tag {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-muted);
    }

    .card-title {
      font-size: 0.98rem;
      font-weight: 800;
      color: #fff;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .card-desc {
      font-size: 0.82rem;
      color: var(--text-muted);
      line-height: 1.45;
      margin-bottom: 6px;
    }

    .card-extra-info {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
      font-size: 0.75rem;
      color: var(--text-dim);
      padding-top: 6px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    .extra-item {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .extra-item i {
      color: var(--neon-cyan);
    }

    /* Card Action Buttons (Edit / Delete / Move) */
    .card-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .btn-card-ctrl {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid transparent;
      color: var(--text-dim);
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-card-ctrl:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }

    .btn-card-ctrl.delete:hover {
      background: rgba(255, 42, 109, 0.2);
      color: var(--neon-pink);
      border-color: rgba(255, 42, 109, 0.3);
    }

    /* Add Item Row */
    .add-item-row {
      margin-top: 10px;
    }

    .btn-add-spot {
      width: 100%;
      background: rgba(255, 255, 255, 0.03);
      border: 1px dashed rgba(255, 255, 255, 0.15);
      color: var(--text-muted);
      padding: 10px;
      border-radius: var(--radius-lg);
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .btn-add-spot:hover {
      background: rgba(5, 217, 232, 0.08);
      border-color: var(--neon-cyan);
      color: var(--neon-cyan);
    }

    /* Bottom Export Bar */
    .bottom-export-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 300;
      background: rgba(7, 10, 18, 0.96);
      backdrop-filter: blur(20px);
      border-top: 1px solid var(--border-subtle);
      padding: 12px 16px calc(var(--safe-bottom) + 8px) 16px;
      box-shadow: 0 -8px 30px rgba(0, 0, 0, 0.7);
    }

    .export-bar-content {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .export-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .export-status-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: rgba(0, 230, 118, 0.15);
      color: var(--neon-green);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
    }

    .export-status-text h5 {
      font-size: 0.88rem;
      font-weight: 800;
      color: #fff;
    }

    .export-status-text p {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .export-btn-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-export-main {
      background: linear-gradient(135deg, #00e676 0%, #00b4d8 100%);
      color: #070a12;
      border: none;
      padding: 10px 18px;
      border-radius: var(--radius-full);
      font-size: 0.88rem;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 20px rgba(0, 230, 118, 0.4);
      transition: all 0.25s var(--ease-spring);
    }

    .btn-export-main:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0, 230, 118, 0.6);
    }

    .btn-export-preview {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-subtle);
      color: #fff;
      padding: 10px 14px;
      border-radius: var(--radius-full);
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn-export-preview:hover {
      background: rgba(255, 255, 255, 0.16);
    }

    /* Modal / Bottom Sheet for Export & Editing */
    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 500;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s var(--ease-spring);
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-window {
      background: var(--bg-surface);

    }

    .modal-header {
      display: flex;
      align-items: center;

      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;

      outline: none;
      white-space: pre-wrap;

      box-shadow: 0 0 15px rgba(5, 217, 232, 0.2);
    }

    .modal-footer {
      padding: 14px 20px;
      border-top: 1px solid var(--border-subtle);
      background: rgba(21, 31, 56, 0.5);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;

      margin-bottom: 14px;
    }

    .form-label {
      display: block;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 6px;

    .form-input, .form-select, .form-textarea {

      background: rgba(255, 255, 255, 0.05);

    /* ==========================================================================
       State Management & Storage
       ========================================================================== */
    const STORAGE_KEY = "osaka_drag_itinerary_v2";
    let itineraryData = [];
    let currentFilteredDay = 0; // 0 means All Days
    let currentExportFormat = "compact";
    let sortableInstances = [];

    // Initialize Data
    function initData() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try {
          itineraryData = JSON.parse(saved);
        } catch (e) {
          console.error("Failed to parse saved data, fallback to default", e);
          itineraryData = JSON.parse(JSON.stringify(DEFAULT_ITINERARY_DATA));
        }
      } else {
        itineraryData = JSON.parse(JSON.stringify(DEFAULT_ITINERARY_DATA));
      }
      renderDays();
      updateBottomStatus();
    }

    function saveData() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(itineraryData));
      updateBottomStatus();
    }

    function resetToDefaultData() {
      if (confirm("確定要將行程重置為預設版本嗎？（您所自訂的順序與修改將會重置）")) {
        itineraryData = JSON.parse(JSON.stringify(DEFAULT_ITINERARY_DATA));
        saveData();
        renderDays();
        showToast("✅ 已成功重設為預設行程！");
      }
    }

    /* ==========================================================================
       Render Engine & SortableJS Setup
       ========================================================================== */
    function renderDays() {
      const container = document.getElementById("daysRenderArea");
      container.innerHTML = "";
      
      // Destroy old sortables
      sortableInstances.forEach(inst => inst.destroy());
      sortableInstances = [];

      const daysToRender = currentFilteredDay === 0 
        ? itineraryData 
        : itineraryData.filter(d => d.day === currentFilteredDay);

      daysToRender.forEach(dayObj => {
        const dayBlock = document.createElement("div");
        dayBlock.className = "day-block";
        dayBlock.id = `day-block-${dayObj.day}`;

        // Header
        const header = document.createElement("div");
        header.className = "day-block-header";
        header.innerHTML = `
          <div class="day-block-title">
            <span class="day-num-tag">Day ${dayObj.day}</span>
            <div>
              <span class="day-main-heading">${dayObj.theme}</span>
              <span class="day-date-tag">‧ ${dayObj.date}</span>
            </div>
          </div>
          <div style="display:flex; align-items:center; gap:8px;">
            <span class="day-item-count">${dayObj.items.length} 項行程</span>
            <button class="btn-action-tool sort-btn" style="padding:4px 10px; font-size:0.75rem;" onclick="autoSortDayByTime(${dayObj.day})">
              <i class="fa-solid fa-arrow-down-short-wide"></i> 排序
            </button>
            <button class="btn-action-tool add-btn" style="padding:4px 10px; font-size:0.75rem;" onclick="openAddModal(${dayObj.day})">
              <i class="fa-solid fa-plus"></i> 新增
            </button>
          </div>
        `;
        dayBlock.appendChild(header);

        // Sleep Advice Box if exists
        if (dayObj.sleepAdvice) {
          const sleepBox = document.createElement("div");
          sleepBox.style.cssText = "background:rgba(168,85,247,0.1); border:1px solid rgba(168,85,247,0.3); border-radius:10px; padding:10px 14px; margin-bottom:12px; font-size:0.8rem; color:#d8b4fe; display:flex; align-items:center; gap:8px;";
          sleepBox.innerHTML = `<i class="fa-solid fa-bed" style="color:var(--neon-purple); flex-shrink:0;"></i> <span><strong>早瞓建議：</strong>${dayObj.sleepAdvice}</span>`;
          dayBlock.appendChild(sleepBox);
        }

        // Sortable List Container
        const listContainer = document.createElement("div");
        listContainer.className = "timeline-sortable-list";
        listContainer.dataset.day = dayObj.day;

        dayObj.items.forEach((item, index) => {
          const card = createItemCard(item, dayObj.day, index);
          listContainer.appendChild(card);
        });

        dayBlock.appendChild(listContainer);

        // Add spot button below
        const addRow = document.createElement("div");
        addRow.className = "add-item-row";
        addRow.innerHTML = `
          <button class="btn-add-spot" onclick="openAddModal(${dayObj.day})">
            <i class="fa-solid fa-plus"></i> 在 Day ${dayObj.day} 新增自訂景點或交通
          </button>
        `;
        dayBlock.appendChild(addRow);

        container.appendChild(dayBlock);

        // Initialize Sortable on this list
        const sortable = new Sortable(listContainer, {
          group: "itinerary-drag-group",
          animation: 250,
          handle: ".drag-handle",
          ghostClass: "sortable-ghost",
          chosenClass: "sortable-chosen",
          dragClass: "sortable-drag",
          delay: 50,
          delayOnTouchOnly: true,
          touchStartThreshold: 5,
          onEnd: function (evt) {
            handleDragEnd(evt);
          }
        });
        sortableInstances.push(sortable);
      });
    }

    function createItemCard(item, dayNum, index) {
      const card = document.createElement("div");
      card.className = `itinerary-card type-${item.type || 'spot'} ${item.highlight ? 'type-highlight' : ''}`;
      card.dataset.id = item.id;
      card.dataset.day = dayNum;

      let badgeClass = "";
      let typeLabel = "景點";
      if (item.type === "transit") { badgeClass = "transit"; typeLabel = "交通"; }
      else if (item.type === "food") { badgeClass = "food"; typeLabel = "美食"; }
      else if (item.type === "shopping") { badgeClass = "food"; typeLabel = "購物"; }
      else if (item.type === "sleep") { badgeClass = "free"; typeLabel = "早瞓"; }
      else if (item.type === "free") { badgeClass = "free"; typeLabel = "自由"; }

      let iconType = "fa-location-dot";
      if (item.type === "transit") iconType = "fa-train-subway";
      if (item.type === "food") iconType = "fa-bowl-food";
      if (item.type === "shopping") iconType = "fa-bag-shopping";
      if (item.type === "sleep") iconType = "fa-bed";

      card.innerHTML = `
        <div class="drag-handle" title="按住拖曳調整先後順序">
          <i class="fa-solid fa-grip-vertical"></i>

        <div class="card-body">

              </span>
              <div class="card-tags">
                <span class="category-tag"><i class="fa-solid ${iconType}"></i> ${typeLabel}</span>
                ${item.location ? `<span class="category-tag" style="color:var(--neon-cyan);">${item.location}</span>` : ''}
              </div>
            </div>
            <div class="card-actions">
              <button class="btn-card-ctrl" onclick="moveItemStep(${dayNum}, '${item.id}', -1)" title="上移">
                <i class="fa-solid fa-arrow-up"></i>
              </button>
              <button class="btn-card-ctrl" onclick="moveItemStep(${dayNum}, '${item.id}', 1)" title="下移">
                <i class="fa-solid fa-arrow-down"></i>
              </button>

      return card;
    }

    /* ==========================================================================
       Drag & Drop Event Handlers
       ========================================================================== */
    function handleDragEnd(evt) {
      const fromDay = parseInt(evt.from.dataset.day);
      const toDay = parseInt(evt.to.dataset.day);
      const oldIndex = evt.oldIndex;
      const newIndex = evt.newIndex;

      if (fromDay === toDay) {
        // Reordered within same day
        const dayObj = itineraryData.find(d => d.day === fromDay);
        if (dayObj) {
          const [movedItem] = dayObj.items.splice(oldIndex, 1);
          dayObj.items.splice(newIndex, 0, movedItem);
        }
      } else {
        // Dragged across different days
        const sourceDayObj = itineraryData.find(d => d.day === fromDay);
        const targetDayObj = itineraryData.find(d => d.day === toDay);
        if (sourceDayObj && targetDayObj) {
          const [movedItem] = sourceDayObj.items.splice(oldIndex, 1);
          targetDayObj.items.splice(newIndex, 0, movedItem);
        }
      }

      saveData();
      renderDays();
      showToast("✨ 順序已調整並自動儲存！");
    }

    function moveItemStep(dayNum, itemId, delta) {
      const dayObj = itineraryData.find(d => d.day === dayNum);
      if (!dayObj) return;
      const index = dayObj.items.findIndex(i => i.id === itemId);
      if (index < 0) return;
      const targetIndex = index + delta;
      if (targetIndex < 0 || targetIndex >= dayObj.items.length) return;

      const [item] = dayObj.items.splice(index, 1);
      dayObj.items.splice(targetIndex, 0, item);
      saveData();
      renderDays();
      showToast("✨ 順序已調整！");
    }

    /* ==========================================================================
       Smart Chronological Sorter
       ========================================================================== */
    function parseTimeToMinutes(timeStr) {
      if (!timeStr) return 9999;
      // Look for format like "09:30" or "9:30"
      const match = timeStr.match(/(\d{1,2})[:：](\d{2})/);
      if (match) {
        let hour = parseInt(match[1]);
        const min = parseInt(match[2]);
        // Handle late night e.g. 01:00 after midnight
        if (hour < 5) hour += 24;
        return hour * 60 + min;
      }
      // Look for simple hours like "22" or "10"
      const hourMatch = timeStr.match(/(\d{1,2})/);
      if (hourMatch) {
        let hour = parseInt(hourMatch[1]);
        if (hour < 5) hour += 24;
        return hour * 60;
      }
      return 9999;
    }

    function autoSortDayByTime(dayNum) {
      const dayObj = itineraryData.find(d => d.day === dayNum);
      if (!dayObj) return;

      dayObj.items.sort((a, b) => {
        const timeA = parseTimeToMinutes(a.time);
        const timeB = parseTimeToMinutes(b.time);
        return timeA - timeB;
      });

      saveData();
      renderDays();
      showToast(`⚡ Day ${dayNum} 已按時間順序自動排序！`);
    }

    function autoSortAllByTime() {
      itineraryData.forEach(dayObj => {
        dayObj.items.sort((a, b) => {
          const timeA = parseTimeToMinutes(a.time);
          const timeB = parseTimeToMinutes(b.time);
          return timeA - timeB;
        });
      });
      saveData();
      renderDays();
      showToast("⚡ 所有 9 天行程已全部按時間起迄順序重新排列！");
    }

    /* ==========================================================================
       Add & Edit Spot Form Modal
       ========================================================================== */
    function openAddModal(dayNum) {
      document.getElementById("editModalTitle").innerHTML = `<i class="fa-solid fa-plus" style="color:var(--neon-pink);"></i> 在 Day ${dayNum} 新增行程項目`;
      document.getElementById("editItemDay").value = dayNum;
      document.getElementById("editItemId").value = "";
      document.getElementById("formItemDay").value = dayNum;
      document.getElementById("formItemType").value = "spot";
      document.getElementById("formItemTime").value = "";
      document.getElementById("formItemLocation").value = "";
      document.getElementById("formItemTitle").value = "";
      document.getElementById("formItemDesc").value = "";
      document.getElementById("formItemNotes").value = "";
      
      openModal("editModal");
    }

    function openEditModal(dayNum, itemId) {
      const dayObj = itineraryData.find(d => d.day === dayNum);
      if (!dayObj) return;
      const item = dayObj.items.find(i => i.id === itemId);
      if (!item) return;

      document.getElementById("editModalTitle").innerHTML = `<i class="fa-solid fa-pen-to-square" style="color:var(--neon-cyan);"></i> 編輯項目：${item.title}`;
      document.getElementById("editItemDay").value = dayNum;
      document.getElementById("editItemId").value = itemId;
      document.getElementById("formItemDay").value = dayNum;
      document.getElementById("formItemType").value = item.type || "spot";
      document.getElementById("formItemTime").value = item.time || "";
      document.getElementById("formItemLocation").value = item.location || "";
      document.getElementById("formItemTitle").value = item.title || "";
      document.getElementById("formItemDesc").value = item.desc || "";
      document.getElementById("formItemNotes").value = item.notes || "";

      openModal("editModal");
    }

    function saveItemForm() {
      const targetDay = parseInt(document.getElementById("formItemDay").value);
      const originalDay = parseInt(document.getElementById("editItemDay").value);
      const itemId = document.getElementById("editItemId").value;

      const title = document.getElementById("formItemTitle").value.trim();
      if (!title) {
        alert("請輸入行程標題！");
        return;
      }

      const itemData = {
        id: itemId || ("custom_" + Date.now()),
        time: document.getElementById("formItemTime").value.trim() || "時間未定",
        title: title,
        type: document.getElementById("formItemType").value,
        location: document.getElementById("formItemLocation").value.trim(),
        desc: document.getElementById("formItemDesc").value.trim(),
        notes: document.getElementById("formItemNotes").value.trim(),
        highlight: document.getElementById("formItemType").value === "spot" || document.getElementById("formItemType").value === "shopping"
      };

      if (itemId) {
        // Editing existing
        if (originalDay === targetDay) {
          const dayObj = itineraryData.find(d => d.day === originalDay);
          const index = dayObj.items.findIndex(i => i.id === itemId);
          if (index >= 0) {
            dayObj.items[index] = itemData;
          }
        } else {
          // Moved to another day
          const origDayObj = itineraryData.find(d => d.day === originalDay);
          origDayObj.items = origDayObj.items.filter(i => i.id !== itemId);
          const targetDayObj = itineraryData.find(d => d.day === targetDay);
          targetDayObj.items.push(itemData);
        }
      } else {
        // Creating new
        const targetDayObj = itineraryData.find(d => d.day === targetDay);
        if (targetDayObj) {
          targetDayObj.items.push(itemData);
        }
      }

      saveData();
      renderDays();
      closeModal("editModal");
      showToast("✅ 行程已成功儲存！");
    }

    function deleteItem(dayNum, itemId) {
      if (confirm("確定要刪除此項行程嗎？")) {
        const dayObj = itineraryData.find(d => d.day === dayNum);
        if (dayObj) {
          dayObj.items = dayObj.items.filter(i => i.id !== itemId);
          saveData();
          renderDays();
          showToast("🗑️ 行程已刪除");
        }
      }
    }

      } 
      else if (format === "detailed") {
        // Full Comprehensive Guide Text Format
        output += `════════════════════════════════════════════\n`;
        output += `  大阪關西 9 天 8 夜 ‧ 完整隨身詳細行程指南\n`;
        output += `  日期：25 號抵達 ～ 2 號返程\n`;
        output += `════════════════════════════════════════════\n\n`;

        days.forEach(d => {
          output += `【Day ${d.day} ‧ ${d.date}】${d.theme}\n`;
          output += `📌 當日精華：${d.summary}\n`;
          if (d.sleepAdvice) {
            output += `🛌 早瞓建議：${d.sleepAdvice}\n`;
          }

          d.items.forEach((item, idx) => {

            if (item.notes) output += `   ‧ 備註：${item.notes}\n`;
            output += `\n`;
          });
          output += `════════════════════════════════════════════\n\n`;
        });

        output += `【隨身實用重要資訊】\n`;

        output += `‧ 緊急就醫與報警：報警 110 / 急救 119\n`;
      }

        output += `> **旅行期間**：25 號抵達 ～ 2 號返程  \n`;

    function openExportModal() {
      const text = generateTextExport(currentExportFormat);
      document.getElementById("exportTextarea").value = text;
      document.getElementById("charCount").innerText = text.length;
      openModal("exportModal");
    }

    function switchExportFormat(format, btnElem) {
      currentExportFormat = format;
      document.querySelectorAll(".export-format-btn").forEach(b => b.classList.remove("active"));
      if (btnElem) btnElem.classList.add("active");
      const text = generateTextExport(currentExportFormat);
      document.getElementById("exportTextarea").value = text;
      document.getElementById("charCount").innerText = text.length;
    }

    function copyExportText() {
      const text = document.getElementById("exportTextarea").value;
      navigator.clipboard.writeText(text).then(() => {
        showToast("✅ 已成功複製文字版行程到剪貼簿！");
      }).catch(() => {
        // Fallback
        const ta = document.getElementById("exportTextarea");
        ta.select();
        document.execCommand("copy");
        showToast("✅ 已成功複製文字版行程！");
      });
    }

    function quickCopyText() {
      const text = generateTextExport("compact");
      navigator.clipboard.writeText(text).then(() => {
        showToast("✅ 已一鍵複製【便攜版】行程！隨時可貼至 LINE / WhatsApp！");
      }).catch(() => {
        openExportModal();
      });
    }

    function downloadTextFile() {
      const text = document.getElementById("exportTextarea").value;
      const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `大阪關西9天8夜行程表_${currentExportFormat}.txt`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast("💾 行程文字檔下載成功！");
    }

    /* ==========================================================================
       Day Filtering & UI Utilities
       ========================================================================== */
    function filterDay(dayNum, btnElem) {
      currentFilteredDay = dayNum;
      document.querySelectorAll(".day-pill-btn").forEach(b => b.classList.remove("active"));
      if (btnElem) btnElem.classList.add("active");
      renderDays();

      if (dayNum !== 0) {
        document.getElementById("bottomStatusText").innerText = `目前顯示：Day ${dayNum}（可隨意拖曳排序）`;
      } else {
        document.getElementById("bottomStatusText").innerText = `行程已就緒（共 9 天完整行程）`;
      }
    }

    function updateBottomStatus() {
      const totalItems = itineraryData.reduce((acc, d) => acc + d.items.length, 0);
      document.getElementById("bottomStatusText").innerText = `行程已就緒（9 天共 ${totalItems} 個景點與交通）`;
    }

    function openModal(id) {
      document.getElementById(id).classList.add("active");
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove("active");
    }

    function showToast(msg) {
      const toast = document.getElementById("toastMsg");
      document.getElementById("toastText").innerText = msg;
      toast.classList.add("show");
      setTimeout(() => {
        toast.classList.remove("show");
      }, 2500);
    }

    // Modal background click to close
    document.querySelectorAll(".modal-overlay").forEach(overlay => {
      overlay.addEventListener("click", function (e) {
        if (e.target === overlay) {
          overlay.classList.remove("active");
        }
      });
    });

    // Run on startup
    window.addEventListener("DOMContentLoaded", () => {
      initData();
    });
  </script>
</body>
</html>
